<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal</title>

  <!-- Required Scramjet scripts -->
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js"></script>

  <style>
    :root {
      --bg: #060910;
      --sidebar: #0a0e18;
      --card: #0f1422;
      --border: #1a2236;
      --text: #e8edf5;
      --muted: #8b9bb8;
      --accent: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 72px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 0;
      gap: 0.5rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f43f5e, #be123c);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      margin-bottom: 1.4rem;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--card);
      color: var(--accent);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      display: flex;
      gap: 0.5rem;
    }

    .search-form {
      flex: 1;
      max-width: 640px;
      display: flex;
      gap: 0.5rem;
    }

    .search-form input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-form input:focus { border-color: var(--accent); }

    .search-form button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 1.3rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #home-view {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      max-width: 480px;
    }

    .hero h1 {
      font-size: 2.4rem;
      margin-bottom: 0.6rem;
    }

    .hero p {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .quick-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-links a {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
    }

    #sj-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo"></div>
    <button class="nav-btn active" onclick="goHome()">HOME</button>
    <button class="nav-btn" onclick="document.getElementById('address').focus()">SEARCH</button>
  </div>

  <div class="main">
    <div class="topbar">
      <form class="search-form" id="sj-form">
        <input id="address" type="text" placeholder="Search or enter a URL..." autocomplete="off" />
        <button type="submit">Go</button>
      </form>
    </div>

    <div class="content">
      <div id="home-view">
        <div class="hero">
          <h1>Crystal</h1>
          <p>Your calm corner of the internet.<br>Search or type a URL to begin.</p>
          <div class="quick-links">
            <a href="#" onclick="doSearch('https://youtube.com'); return false;">YouTube</a>
            <a href="#" onclick="doSearch('https://x.com'); return false;">X</a>
            <a href="#" onclick="doSearch('https://reddit.com'); return false;">Reddit</a>
            <a href="#" onclick="doSearch('https://github.com'); return false;">GitHub</a>
          </div>
        </div>
      </div>

      <!-- Scramjet will put the frame here -->
    </div>
  </div>

  <script>
    const { ScramjetController } = $scramjetLoadController();

    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });

    scramjet.init();

    const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

    const form = document.getElementById("sj-form");
    const address = document.getElementById("address");
    const homeView = document.getElementById("home-view");

    let currentFrame = null;

    async function doSearch(raw) {
      try {
        await registerSW();
      } catch (err) {
        alert("Service Worker failed to register: " + err);
        return;
      }

      let url = raw.trim();
      if (!url) return;

      // Simple search / URL detection
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        if (url.includes(".") && !url.includes(" ")) {
          url = "https://" + url;
        } else {
          url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
        }
      }

      // Set transport (same as original Scramjet-App)
      let wispUrl = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
      if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
        await connection.setTransport("/libcurl/index.mjs", [{ websocket: wispUrl }]);
      }

      // Hide home and show frame
      homeView.classList.add("hidden");

      if (currentFrame) {
        currentFrame.frame.remove();
      }

      currentFrame = scramjet.createFrame();
      currentFrame.frame.id = "sj-frame";
      currentFrame.frame.style.display = "block";
      document.querySelector(".content").appendChild(currentFrame.frame);

      currentFrame.go(url);
      address.value = url;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      doSearch(address.value);
    });

    function goHome() {
      if (currentFrame) {
        currentFrame.frame.remove();
        currentFrame = null;
      }
      homeView.classList.remove("hidden");
      address.value = "";
    }
  </script>
</body>
</html>
