<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal</title>
  <style>
    :root {
      --bg: #060910;
      --sidebar: #0a0e18;
      --card: #0f1422;
      --border: #1a2236;
      --text: #e8edf5;
      --muted: #8b9bb8;
      --accent: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 72px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 0;
      gap: 0.5rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f43f5e, #be123c);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      margin-bottom: 1.4rem;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: var(--card);
      color: var(--accent);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--sidebar);
      display: flex;
      gap: 0.5rem;
    }

    .search-form {
      flex: 1;
      max-width: 640px;
      display: flex;
      gap: 0.5rem;
    }

    .search-form input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-form input:focus { border-color: var(--accent); }

    .search-form button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 1.3rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      max-width: 480px;
    }

    .hero h1 {
      font-size: 2.4rem;
      margin-bottom: 0.6rem;
    }

    .hero p {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .quick-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-links a {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo"></div>
    <button class="nav-btn" onclick="location.reload()">HOME</button>
  </div>

  <div class="main">
    <div class="topbar">
      <form class="search-form" id="searchForm">
        <input id="searchInput" type="text" placeholder="Search or enter a URL..." autocomplete="off" />
        <button type="submit">Go</button>
      </form>
    </div>

    <div class="content">
      <div class="hero">
        <h1>Crystal</h1>
        <p>Your calm corner of the internet.<br>Search or type a URL to begin.</p>
        <div class="quick-links">
          <a href="https://youtube.com" target="_blank">YouTube</a>
          <a href="https://x.com" target="_blank">X</a>
          <a href="https://reddit.com" target="_blank">Reddit</a>
          <a href="https://github.com" target="_blank">GitHub</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let value = document.getElementById("searchInput").value.trim();
      if (!value) return;

      let url;
      if (value.startsWith("http://") || value.startsWith("https://")) {
        url = value;
      } else if (value.includes(".") && !value.includes(" ")) {
        url = "https://" + value;
      } else {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(value);
      }

      window.open(url, "_blank");
    });
  </script>
</body>
</html>
